name: update
# Four times a day (meant to be started by the hub's tic-dispatch Worker, because GitHub fires schedules 4-9 h
# late; its own cron is the fallback), on every push to main, and by hand: the tests, the last run's state from
# this repository's Actions cache, a live collection, the site build and feed check, then a deploy of site/ to
# Cloudflare Pages.
#
# State: Headwind reports list changes as the difference between two of its own readings, and a failed lane keeps
# its last good copy. Both need the run before: data/snapshot.json and the two list indexes in data/state/. They
# are kept in the Actions cache and not on the site. Each run saves a new cache entry and the next run restores the
# newest. GitHub drops an entry nobody has read for 7 days. A second copy goes to this repository's release `state`
# as an asset (14 Nov 2026): headwind-state.tar.gz, the newest, in release `state`. Dated daily copies and ship-table
# versions went to release `state-YYYY-qN` from 18 Nov 2026 to the public window change; those stay, and every
# run's state and site/ now go to the private archive instead. Release assets do not expire.
# The repository is public (since 15 Nov 2026), so the release is public and the cache is to be treated as
# public too: nothing goes into the state that may not be published. The indexes hold the publishers' own entry
# ids, types and programs, taken from public lists, and since headwind-1.9 the names and address countries Headwind
# publishes (every list but the UN's), and short name hashes; never UN list text. A
# run restores the cache first, the release asset when the cache has nothing, and the newest copy in the private
# archive (lane `state`, see the last step) when neither has it. With none of the three the run fails, so a
# lost state is an alarm and not a silent first reading; start a deliberate first reading by hand with
# first_reading ticked. State is saved after the feed check and before the deploy, so a failed deploy does not
# lose a change.
#
# Private archive (the last two steps): every run's raw replies, history/, run state and deployed site/ also go to
# the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is replaced or deleted. The run
# state and site/ are otherwise kept only for a while (the cache) or replaced by the next run (the release `state`,
# the deploy), and the archive keeps every version.
#
# Secrets: EIA_API_KEY (energy lane; without it that lane fails and the rest run), CENSUS_API_KEY (the trade lane,
# US mineral imports by country; the same), CLOUDFLARE_PAGES_TOKEN
# (Cloudflare Pages: Edit), and the account ID as repo variable CLOUDFLARE_ACCOUNT_ID. Without the Cloudflare
# pair everything runs except the deploy. Collected data is not committed.
#
# History (since 15 Nov 2026, the kit's tic-history/1, doctrine/kit/docs/history-log.md): after the feed check, the
# kit compares the feed with history/state.json and writes one line per item that is new, changed or ended to
# history/log/YYYY/MM/DD.jsonl, and the items ended in the last 7 days to site/data/ended.geojson (deployed with the
# site, read by COP). history/ is committed to main by the workflow's token, which starts no further run. It holds
# only published feed items, never the run state. A failure there is a gap in the history, never a missed deploy.
# Public window (the last step): the committed history/ keeps dated files from 1 Dec 2026 for 45 days
# (headwind/archive.py, PUBLIC_DAYS); every file committed before then stays. An older file leaves the tree only on a
# run whose history lane reached the private archive, and only with the bytes that run archived. git history and the
# archive's history lane keep every removed file.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      first_reading:
        description: "Start from no state on purpose (sets new list baselines). Only when the state is known lost."
        type: boolean
        default: false
permissions:
  contents: write     # the release that keeps the second copy of the state, and the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Last run's state from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: headwind-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: headwind-state-
      # Then the private archive: its lane `state` holds the run state of every run whose feed check passed. The
      # restore goes to a temporary folder first and is copied into data/ only when it finished, so a broken
      # download never leaves half a state behind.
      - name: No cache entry, so the state from the release (or the private archive)
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          FIRST_READING: ${{ inputs.first_reading }}
        run: |
          if gh release download state --pattern headwind-state.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/headwind-state.tar.gz"
            echo "::warning::No state in the Actions cache; restored the copy kept in the release 'state'."
            ls -l data/snapshot.json data/state
          elif [ -n "$ARCHIVE_TOKEN" ] && GH_TOKEN="$ARCHIVE_TOKEN" python tools/tic_archive.py restore \
                 --program headwind --lane state --dest "$RUNNER_TEMP/archive-state"; then
            mkdir -p data && cp -R "$RUNNER_TEMP/archive-state/." data/
            echo "::warning::No state in the Actions cache or the release 'state'; restored the newest copy kept in the private archive."
            ls -l data/snapshot.json data/state
          elif [ "$FIRST_READING" = "true" ]; then
            echo "::warning::No state anywhere and first_reading was chosen: this run sets new list baselines."
          else
            echo "::error::No state in the Actions cache, the release 'state' or the private archive. Stopping so the list baselines are not started over. If the state is known lost, run the workflow by hand with first_reading ticked."
            exit 1
          fi
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        run: python tools/headwind.py collect
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - name: Build site/
        run: python tools/headwind.py build
      - name: Feed check
        id: check
        run: python tools/headwind.py check
      # The run's checkout can be older than main: a run queued behind another starts from the commit that
      # triggered it, without the history commit the run before made. So history/ is taken from main's tip first,
      # and the commit is made on main's tip with only history/ staged (reset --mixed moves HEAD and the index,
      # never the working tree, which holds the build's site/ files). No rebase, so nothing unstaged can stop it.
      # --reading-key data_as_of (kit 0.5.13, 18 Nov 2026): series ids carry no date, so a new reading is a
      # changed line in the log, not the reading before ended.
      - name: History (history/, and site/data/ended.geojson)
        id: history
        run: |
          git fetch -q --depth=1 origin main && git checkout --no-overlay -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::could not take history/ from main's tip; using this checkout's"
          # Retention archives (history/deltas, history/fetch-index): appended after main's tip is taken, so a
          # queued run cannot overwrite lines another run wrote; a failure is a warning, never a missed deploy.
          python -m headwind.archive append \
            || echo "::warning::archive step failed; list changes and fetch index not archived this run"
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson \
            --reading-key data_as_of --fill-last-change \
            || { echo "::warning::history step failed; this run is missing from history/"; exit 0; }
          git config user.name "headwind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      - name: Keep this run's state for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: headwind-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          # Cloudflare's API fails now and then with nothing wrong here ("An unknown error occurred ... [code: 8000000]"),
          # which failed the run and mailed an alert. Try three times, 20 s and 60 s apart.
          for wait in 0 20 60; do
            if [ "$wait" != 0 ]; then echo "::warning::Cloudflare deploy failed; trying again in ${wait} s"; sleep "$wait"; fi
            if npx --yes wrangler@4.151.3 pages deploy site --project-name headwind --branch main \
                 --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"    # only here: the skip above also ends the step green
              exit 0
            fi
          done
          echo "::error::Cloudflare Pages deploy failed three times"; exit 1
      # After the deploy, so a failed upload never holds the site back; it still fails the run, which mails the owner.
      # Release `state` keeps only the newest tarball (the restore path above). The dated daily copies and ship-table
      # versions that went to `state-YYYY-qN` stay there; new ones go only to the private archive (lanes state and
      # site, the steps below), which keeps every run's version.
      - name: Second copy of the state in the release (public, like the repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf headwind-state.tar.gz data/snapshot.json data/state
          ls -l headwind-state.tar.gz
          title="Run state"
          notes="Headwind's run state: the last good snapshot and the list indexes (the publishers' own entry ids, types and programs, from public lists; names and address countries as Headwind publishes them, for every list but the UN Security Council's; short name hashes). Kept for the workflow to restore. Public with the repository, so nothing goes into it that may not be published."
          if ! gh release view state >/dev/null 2>&1; then
            gh release create state --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release edit state --title "$title" --notes "$notes" >/dev/null
          fi
          gh release upload state headwind-state.tar.gz --clobber
      # Entities and checksums, after the state upload so the manifests cover this run's files. The named entries of
      # the run state as a FollowTheMoney entity stream (headwind/ftm.py; checked against FtM's model before it is
      # written) go to release `entities`, replaced each run like `state`; every version of the state they are made
      # from is kept in the private archive (lane state). Then every release gets SHA256SUMS and
      # headwind-manifest.json (headwind/manifest.py): a file uploaded in this run is hashed here and must match
      # GitHub's digest of the upload, the others are taken from GitHub's digest, and a manifest is uploaded only
      # when it changed. Nothing is deleted.
      - name: Entities (FollowTheMoney) and release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are written by the exporter from the same table as about.json: every list's publisher,
          # title, source, licence and its link, attribution statement and what was changed.
          python -m headwind.ftm --state data/state --out headwind-entities.ftm.gz --about headwind-entities.about.json --notes "$RUNNER_TEMP/entities-notes.md"
          title="Entities (FollowTheMoney)"
          if ! gh release view entities >/dev/null 2>&1; then
            gh release create entities --prerelease --latest=false --title "$title" --notes-file "$RUNNER_TEMP/entities-notes.md"
          else
            gh release edit entities --title "$title" --notes-file "$RUNNER_TEMP/entities-notes.md" >/dev/null
          fi
          gh release upload entities headwind-entities.ftm.gz headwind-entities.about.json --clobber
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            out="$RUNNER_TEMP/manifest/$tag"
            res=$(python -m headwind.manifest release "$tag" --repo "$GITHUB_REPOSITORY" --out-dir "$out" --local-dir .) || { echo "::error::release $tag: checksums not written (see above)"; exit 1; }
            if [ "$res" = "changed" ]; then
              gh release upload "$tag" "$out/SHA256SUMS" "$out/headwind-manifest.json" --clobber
              echo "$tag: SHA256SUMS and headwind-manifest.json updated"
            else
              echo "$tag: checksums unchanged"
            fi
          done
      # Private archive (19 Nov 2026, retention rule: no data lost). The raw source copies (sanctions lists, CSL,
      # prices, notices) were discarded with the runner; they go to the PRIVATE repo metacog-osint/tic-archive as
      # release assets (tools/tic_archive.py, release headwind-raw-YYYY-MM: a snapshot per run, only changed files
      # uploaded). Not to the public state releases above. API keys are replaced by REDACTED if a reply echoes one.
      # After the deploy, so a failure turns the run red but never holds the live site. Token: TIC_ARCHIVE_TOKEN,
      # contents:write on tic-archive only.
      - name: Private archive (raw replies, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program headwind --lane raw --src data/raw \
            --redact-env-if-set EIA_API_KEY --redact-env-if-set CENSUS_API_KEY
      # What this public repository keeps only for a while or replaces, to the same private archive, one lane each
      # (release headwind-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing replaced):
      #   history  history/ as the History step left it: the history log, list changes in full, the fetch index,
      #            the kit's state.json. Committed to main too. Only when that step ran, so a run that stopped
      #            earlier never archives an older checkout's history/ as the newest snapshot.
      #   state    data/ without data/raw: the run state, which the Actions cache keeps for 7 days and the release
      #            `state` replaces each run. Only once the feed check passed, so it is a state the next run may use
      #            (the restore step above reads it when the cache and the release have none).
      #   site     site/ as deployed: every published file, vessels.json (Wake) and events.json (Verdict) among them,
      #            each replaced by the next deploy. Only when wrangler deployed it (the deploy step's output
      #            `deployed`): without the Cloudflare secrets the step skips the deploy and still succeeds.
      # These files are all public already, so nothing is redacted and the archived bytes match the public copy.
      # Each lane is tried even if another failed; any failure turns the run red after the live site is updated.
      - name: Private archive (history, run state and site, to tic-archive)
        id: archive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          HISTORY: ${{ steps.history.outcome }}
          CHECKED: ${{ steps.check.outcome }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so history/, the run state and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          if [ "$HISTORY" = "success" ]; then
            if python tools/tic_archive.py put --program headwind --lane history --src history; then
              echo "history_archived=true" >> "$GITHUB_OUTPUT"
            else
              failed=1
            fi
          else
            echo "history: the History step did not run, so history/ was not archived"
          fi
          if [ "$CHECKED" = "success" ]; then
            python tools/tic_archive.py put --program headwind --lane state --src data --exclude 'raw/*' || failed=1
          else
            echo "state: the feed check did not pass this run, so the state was not archived"
          fi
          if [ "$DEPLOYED" = "true" ]; then
            python tools/tic_archive.py put --program headwind --lane site --src site || failed=1
          else
            echo "site: not deployed this run (the deploy failed or was skipped), so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
      # Public window for history/ (header): runs only when this run's history lane reached the archive. A file
      # leaves main only if main's copy has the same bytes as the one archived here (git hash-object), so a file
      # that changed after this run's snapshot stays until a later run archives it. Only history/ is staged.
      - name: Public window for history/ (older files stay in the private archive)
        if: ${{ !cancelled() && steps.archive.outputs.history_archived == 'true' }}
        run: |
          old=$(python -m headwind.archive outside-window --history history)
          if [ -z "$old" ]; then echo "history/: nothing outside the public window"; exit 0; fi
          stamp="history: public window $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            n=0
            while IFS= read -r rel; do
              f="history/$rel"
              main_blob=$(git rev-parse -q --verify "FETCH_HEAD:$f" 2>/dev/null) || continue    # not on main
              if [ "$main_blob" = "$(git hash-object "$f")" ]; then
                git rm -q --cached -- "$f" && n=$((n + 1))
              else
                echo "::warning::$f on main differs from the archived copy; kept for a later run"
              fi
            done <<< "$old"
            git diff --cached --quiet -- history && { echo "history/: nothing to remove from main"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && { echo "history/: $n file(s) left the public window"; exit 0; }
            echo "::warning::public window push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::public window not applied this run; the next run tries again"
