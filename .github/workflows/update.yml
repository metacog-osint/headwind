name: update
# Four times a day (meant to be started by the hub's tic-dispatch Worker, because GitHub fires schedules 4-9 h
# late; its own cron is the fallback), on every push to main, and by hand: the tests, the last run's state from
# this repository's Actions cache, a live collection, the site build and feed check, then a deploy of site/ to
# Cloudflare Pages.
#
# State: Headwind reports list changes as the difference between two of its own readings, and a failed lane keeps
# its last good copy. Both need the run before: data/snapshot.json and the two list indexes in data/state/. They
# are kept in the Actions cache and not on the site. Each run saves a new cache entry and the next run restores the
# newest. GitHub drops an entry nobody has read for 7 days. A second copy goes to this repository's release `state`
# as assets (14 Nov 2026): headwind-state.tar.gz, the newest, in release `state`; dated daily copies are kept for
# good in release `state-YYYY-qN` (retention, 18 Nov 2026; none deleted). Release assets do not expire.
# The repository is public (since 15 Nov 2026), so the release is public and the cache is to be treated as
# public too: nothing goes into the state that may not be published. The indexes hold the publishers' own entry
# ids, types and programs, taken from public lists, and since headwind-1.9 the names and address countries Headwind
# publishes (every list but the UN's), and short name hashes; never UN list text. A
# run restores the cache first and the release asset when the cache has nothing. With neither the run fails, so a
# lost state is an alarm and not a silent first reading; start a deliberate first reading by hand with
# first_reading ticked. State is saved after the feed check and before the deploy, so a failed deploy does not
# lose a change.
#
# Secrets: EIA_API_KEY (energy lane; without it that lane fails and the rest run), CENSUS_API_KEY (the trade lane,
# US mineral imports by country; the same), CLOUDFLARE_PAGES_TOKEN
# (Cloudflare Pages: Edit), and the account ID as repo variable CLOUDFLARE_ACCOUNT_ID. Without the Cloudflare
# pair everything runs except the deploy. Collected data is not committed.
#
# History (since 15 Nov 2026, the kit's tic-history/1, doctrine/kit/docs/history-log.md): after the feed check, the
# kit compares the feed with history/state.json and writes one line per item that is new, changed or ended to
# history/log/YYYY/MM/DD.jsonl, and the items ended in the last 7 days to site/data/ended.geojson (deployed with the
# site, read by COP). history/ is committed to main by the workflow's token, which starts no further run. It holds
# only published feed items, never the run state. A failure there is a gap in the history, never a missed deploy.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      first_reading:
        description: "Start from no state on purpose (sets new list baselines). Only when the state is known lost."
        type: boolean
        default: false
permissions:
  contents: write     # the release that keeps the second copy of the state, and the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Last run's state from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: headwind-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: headwind-state-
      - name: No cache entry, so the state from the release
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_READING: ${{ inputs.first_reading }}
        run: |
          if gh release download state --pattern headwind-state.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/headwind-state.tar.gz"
            echo "::warning::No state in the Actions cache; restored the copy kept in the release 'state'."
            ls -l data/snapshot.json data/state
          elif [ "$FIRST_READING" = "true" ]; then
            echo "::warning::No state anywhere and first_reading was chosen: this run sets new list baselines."
          else
            echo "::error::No state in the Actions cache or the release 'state'. Stopping so the list baselines are not started over. If the state is known lost, run the workflow by hand with first_reading ticked."
            exit 1
          fi
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        run: python tools/headwind.py collect
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - name: Build site/
        run: python tools/headwind.py build
      - name: Feed check
        run: python tools/headwind.py check
      # The run's checkout can be older than main: a run queued behind another starts from the commit that
      # triggered it, without the history commit the run before made. So history/ is taken from main's tip first,
      # and the commit is made on main's tip with only history/ staged (reset --mixed moves HEAD and the index,
      # never the working tree, which holds the build's site/ files). No rebase, so nothing unstaged can stop it.
      # --reading-key data_as_of (kit 0.5.13, 18 Nov 2026): series ids carry no date, so a new reading is a
      # changed line in the log, not the reading before ended.
      - name: History (history/, and site/data/ended.geojson)
        run: |
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::could not take history/ from main's tip; using this checkout's"
          # Retention archives (history/deltas, history/fetch-index): appended after main's tip is taken, so a
          # queued run cannot overwrite lines another run wrote; a failure is a warning, never a missed deploy.
          python -m headwind.archive append \
            || echo "::warning::archive step failed; list changes and fetch index not archived this run"
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson \
            --reading-key data_as_of --fill-last-change \
            || { echo "::warning::history step failed; this run is missing from history/"; exit 0; }
          git config user.name "headwind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      - name: Keep this run's state for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: headwind-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name headwind --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true
      # After the deploy, so a failed upload never holds the site back; it still fails the run, which mails the owner.
      # Release `state` keeps only the newest tarball (the restore path above). Dated copies are kept for good in
      # one release per quarter, `state-YYYY-qN` (about 92 assets a quarter against the 1,000 limit); a same-day
      # run replaces that day's copy, and the changes between two runs are in history/deltas.
      - name: Second copy of the state in the release (public, like the repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf headwind-state.tar.gz data/snapshot.json data/state
          ls -l headwind-state.tar.gz
          day="headwind-state-$(date -u +%Y-%m-%d).tar.gz"
          cp headwind-state.tar.gz "$day"
          q="state-$(date -u +%Y)-q$(( (10#$(date -u +%m) - 1) / 3 + 1 ))"
          title="Run state"
          notes="Headwind's run state: the last good snapshot and the list indexes (the publishers' own entry ids, types and programs, from public lists; names and address countries as Headwind publishes them, for every list but the UN Security Council's; short name hashes). Kept for the workflow to restore. Public with the repository, so nothing goes into it that may not be published."
          if ! gh release view state >/dev/null 2>&1; then
            gh release create state --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release edit state --title "$title" --notes "$notes" >/dev/null
          fi
          gh release upload state headwind-state.tar.gz --clobber
          qnotes="Headwind's dated run states and ship-table versions for one quarter, kept for good (nothing is deleted). Public with the repository, so nothing goes into them that may not be published."
          gh release view "$q" >/dev/null 2>&1 || gh release create "$q" --prerelease --latest=false --title "$q" --notes "$qnotes"
          gh release upload "$q" "$day" --clobber
          # Ship table (data/vessels.json): one dated asset per changed version, named with its content digest.
          digest=$(python -m headwind.archive vessels-digest site/data/vessels.json)
          last=$(gh release view "$q" --json assets --jq '.assets[].name' | grep -E '^headwind-vessels-' | sort | tail -n 1 || true)
          case "$last" in
            *"-$digest.json.gz") echo "vessels.json unchanged (digest $digest)";;
            *) vname="headwind-vessels-$(date -u +%Y-%m-%dT%H%M)-$digest.json.gz"
               gzip -9 -n -c site/data/vessels.json > "$vname"
               gh release upload "$q" "$vname";;
          esac
          n=$(gh release view "$q" --json assets --jq '.assets | length')
          echo "release $q holds $n assets (limit 1,000)"
          if [ "$n" -ge 950 ]; then echo "::error::release $q has $n assets, near the 1,000 limit"; exit 1; fi
      # Private archive (19 Nov 2026, retention rule: no data lost). The raw source copies (sanctions lists, CSL,
      # prices, notices) were discarded with the runner; they go to the PRIVATE repo metacog-osint/tic-archive as
      # release assets (tools/tic_archive.py, release headwind-raw-YYYY-MM: a snapshot per run, only changed files
      # uploaded). Not to the public state releases above. API keys are replaced by REDACTED if a reply echoes one.
      # After the deploy, so a failure turns the run red but never holds the live site. Token: TIC_ARCHIVE_TOKEN,
      # contents:write on tic-archive only.
      - name: Private archive (raw replies, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program headwind --lane raw --src data/raw \
            --redact-env-if-set EIA_API_KEY --redact-env-if-set CENSUS_API_KEY
